name: Live check
# Verifies the deployed site from outside: after every successful deploy, once a day, and on demand.
# Read-only and polite (3 requests in flight). A failure opens (or comments on) one GitHub issue, so a bad deploy is noticed here
# and not by a visitor. While the site is a staging preview use LIVE_EXPECT=staging; set the repository variable to `production` at launch.
on:
  # Safe use of workflow_run: the job checks out the default branch only and consumes nothing (code, artifacts, inputs) from the
  # triggering run, which itself only runs for pushes/dispatches on master.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Deploy to Production Server"]
    types: [completed]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-check
  cancel-in-progress: false

env:
  SITE_URL: https://hadramout-center.novixa.dev
  EXPECT: ${{ vars.LIVE_EXPECT || 'staging' }}

jobs:
  live-check:
    # after a deploy: only when it succeeded (a failed deploy already shows as a failed run)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Let the new container settle after a deploy
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 45
      - name: Cutover check (host, indexing mode, redirects, headers, health)
        id: cutover
        run: node scripts/cutover-check.mjs "$SITE_URL" --expect "$EXPECT" | tee cutover.txt
      - name: SEO and social-card audit
        id: seo
        if: ${{ !cancelled() }}
        run: node scripts/seo-audit.mjs "$SITE_URL" --expect "$EXPECT" | tee seo.txt
      - name: Site sweep (sitemap sample and internal links)
        id: sweep
        if: ${{ !cancelled() }}
        run: node scripts/site-sweep.mjs "$SITE_URL" --sample 60 --links 100 --expect "$EXPECT" | tee sweep.txt
      - name: Open or update the issue when something failed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live check failed: ${SITE_URL}"
          body="The live check failed for ${SITE_URL} (expecting ${EXPECT}). Run: ${RUN_URL}

          Failed lines:
          \`\`\`
          $(grep -h -E '^(FAIL|\[error\]|ERROR|  \[error\])' cutover.txt seo.txt sweep.txt 2>/dev/null | head -25)
          \`\`\`"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-check
          path: |
            cutover.txt
            seo.txt
            sweep.txt
          if-no-files-found: ignore
          retention-days: 14
