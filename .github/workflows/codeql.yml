name: CodeQL
# Static security analysis of the TypeScript/JavaScript code and of the workflows themselves; results appear under Security → Code scanning.
# Free for public repositories; on a private repository it needs GitHub Advanced Security, so the job is skipped there.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 2" # weekly, so new queries also run against unchanged code

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # asked from the API: scheduled runs carry no repository object in their event payload
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.repo.outputs.public }}
    steps:
      - id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "public=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private | not')" >> "$GITHUB_OUTPUT"

  analyze:
    needs: [visibility]
    if: ${{ needs.visibility.outputs.public == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore: [content, docs, data, public, "src/app/(payload)/admin/importMap.js"]
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
