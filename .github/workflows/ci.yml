name: CI
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAYLOAD_SECRET: ci-only-secret-0123456789abcdef0123456789
      DATABASE_URL: file:./data/ci.db
      DATA_DIR: ./data
      SITE_URL: http://localhost:3000
      TRANSLATION_PROVIDER: none   # "mock" is rejected by the production build on purpose
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip   # dead code (unused files, dependencies, exports) stays out
      # runtime dependencies only; a critical advisory blocks the change (lower ones are triaged in docs/security/SECURITY_REVIEW.md)
      - name: No critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=critical
      # A component added to payload.config.ts but missing from the generated import map is silently not rendered.
      - name: Payload import map matches the config
        env:
          PAYLOAD_SECRET: ci-import-map-check-only-0123456789
        run: |
          npm run generate:importmap
          git diff --exit-code -- 'src/app/(payload)/admin/importMap.js'
      - run: npm test
      - run: npm run build
      # Runtime tier: fresh database from the committed snapshot, then the standalone server (as in Docker) is probed.
      - name: Migrate and seed a throwaway database
        env:
          DATABASE_URL: file:${{ github.workspace }}/.smoke-data/payload.db
          DATA_DIR: ${{ github.workspace }}/.smoke-data
          ADMIN_EMAIL: ci@example.org
          ADMIN_PASSWORD: ci-only-password-123456
        run: |
          mkdir -p .smoke-data
          npm run payload -- migrate
          npm run db:seed
      - name: Smoke test the built server (routes, regressions, SEO audit, browser journeys, sitemap sweep)
        env:
          DB_DIR: ${{ github.workspace }}/.smoke-data
          RUN_E2E: "1"   # real Chrome (preinstalled on ubuntu-latest): scripts/e2e.mjs, scripts/site-sweep.mjs, scripts/admin-e2e.mjs
          # the throwaway admin seeded in the step above (CI-only values), for the admin journeys
          ADMIN_EMAIL: ci@example.org
          ADMIN_PASSWORD: ci-only-password-123456
        run: bash scripts/smoke-prod.sh
      - name: Keep the test server logs when the smoke tier fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-server-logs
          path: /tmp/hc-smoke/server-*.log
          if-no-files-found: ignore

  # The deploy workflow builds this image on every push to master. Building it on the PR as well catches failures that only exist
  # inside Docker (e.g. an npm lifecycle script that needs repo files which the `deps` stage does not have yet).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the production image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Workflow security lint (template injection, unpinned actions, token permissions, credential persistence).
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: zizmor
        run: pipx run zizmor==1.31.1 --offline --format github .github/workflows
