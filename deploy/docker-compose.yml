# Production stack on the shared Novixa VPS. No ports are published: mailcow's nginx (80/443, Cloudflare in front)
# reaches the app through the external Docker network `hadramout-center-edge`, created by deploy/server-setup.sh.
# Lives in /opt/hadramout-center next to a filled .env (see .env.production.example).
services:
  app:
    image: ${APP_IMAGE:-hadramout-center-platform:latest}
    container_name: hadramout-center-app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - hc_data:/data
    networks:
      - edge
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/hc/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # One-off tasks:  docker compose run --rm tools npm run db:seed   |   docker compose run --rm tools npm run import:images
  tools:
    profiles: ["tools"]
    image: ${TOOLS_IMAGE:-hadramout-center-platform-tools:latest}
    user: "1000:1000"   # same uid as the app (node) so files written to /data stay writable by it
    env_file: .env
    environment:
      NODE_ENV: production
      HOME: /tmp
    volumes:
      - hc_data:/data

volumes:
  hc_data:

networks:
  edge:
    name: hadramout-center-edge
    external: true
