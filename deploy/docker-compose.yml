# Production stack: app + Caddy (automatic HTTPS). Copy this folder to the VPS (e.g. /opt/hadramout) next to a filled .env.
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/novixa-dev/hadramout-center-platform:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - hc_data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/hc/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # One-off tasks:  docker compose run --rm tools npm run db:seed
  tools:
    profiles: ["tools"]
    image: ${TOOLS_IMAGE:-ghcr.io/novixa-dev/hadramout-center-platform-tools:latest}
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - hc_data:/data

volumes:
  hc_data:
  caddy_data:
  caddy_config:
