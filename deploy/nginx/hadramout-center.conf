# ==============================================================================
# hadramout-center.novixa.dev — site block for mailcow's nginx on the Novixa VPS.
#
# Installed by deploy/server-setup.sh to
# /opt/mailcow-dockerized/data/conf/nginx/hadramout-center.conf. The script runs
# `nginx -t` and restores the previous file if the test fails, so a bad edit can
# never take down mailcow's nginx (webmail, novixa.dev, pizza-house…).
# Edit it in the repository, not on the server.
#
# It only answers for hadramout-center.novixa.dev; every other host is untouched.
# ==============================================================================

server {
    listen 80;
    server_name hadramout-center.novixa.dev;
    return 301 https://hadramout-center.novixa.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hadramout-center.novixa.dev;

    # Cloudflare Origin Certificate (*.novixa.dev) — this site's own copy.
    ssl_certificate     /etc/nginx/conf.d/hadramout-center/origin.pem;
    ssl_certificate_key /etc/nginx/conf.d/hadramout-center/origin.key;

    # Real visitor IP, believed only from Cloudflare's published ranges
    # (https://www.cloudflare.com/ips/).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Security headers (mirrors vercel.json); cache headers come from the app container.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Resolved per request through Docker's DNS, so mailcow's nginx still starts
    # when the app container is down (this site then answers 502 instead).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hadramout_center_app http://hadramout-center-app:80;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;

    location / {
        proxy_pass $hadramout_center_app;
        proxy_read_timeout 30s;
    }
}
