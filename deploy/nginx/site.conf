# ==============================================================================
# Static file server inside the hadramout-center-app container (nginx:alpine).
# Serves the active release: /srv is /var/www/hadramout-center on the host and
# `current` is the symlink the deploy workflow switches atomically.
# Installed by deploy/server-setup.sh to /opt/hadramout-center/site.conf.
# ==============================================================================

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /srv/current;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/xml text/plain;

    # Entry point, service worker and release marker must always be revalidated.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /version.txt {
        add_header Cache-Control "no-store";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "public, max-age=86400";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
